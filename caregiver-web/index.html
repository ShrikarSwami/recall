<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go-go · caregiver</title>
<style>
  /* Rough on purpose: the frontend devs own the polish. See caregiver-web/AGENTS.md. */
  :root { --bg:#0e1110; --card:#171b19; --line:#2a302d; --fg:#e8efe9; --dim:#8c9a91; --g:#00e04a; --warn:#ffb020; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .alert { border-color:var(--warn); } .alert p { color:var(--warn); }
  .row { display:flex; justify-content:space-between; }
  #feed div { padding:6px 0; border-bottom:1px solid var(--line); } #feed b { color:var(--g); }
  .muted { color:var(--dim); font-size:13px; }
  input, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#0b0d0c; color:var(--fg); }
  button { background:var(--g); color:#021; font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>Go-go <span class="muted" id="conn">connecting…</span></h1>
  <section id="alerts"><h2>Alerts</h2><p class="muted">Nothing needs you right now.</p></section>
  <section><h2>Right now</h2>
    <div class="row"><span>Glasses</span><span id="s-glasses">–</span></div>
    <div class="row"><span>Wearing them</span><span id="s-worn">–</span></div>
    <div class="row"><span>In front of them</span><span id="s-view">–</span></div>
  </section>
  <section><h2>What they asked</h2><div id="feed"></div></section>
  <section><h2>Patient name (e.g. a judge's)</h2>
    <form id="pf" style="display:flex"><input id="pname" placeholder="Somya Gupta" style="flex:1;margin-right:6px"><button>Set</button></form>
  </section>
  <p class="muted">Everything here stays on this network. Nothing is uploaded.</p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function add(html) { var d = document.createElement("div"); d.innerHTML = html; $("feed").insertBefore(d, $("feed").firstChild); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function refresh() {
    fetch("/api/state").then(function (r) { return r.json(); }).then(function (s) {
      $("s-glasses").textContent = s.glasses ? "connected" : "not connected";
      $("s-worn").textContent = s.worn === null ? "unknown" : s.worn ? "yes" : "no";
      $("s-view").textContent = s.in_view || "no one recognised";
    }).catch(function () {});
  }
  function connect() {
    var ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/caregiver");
    ws.onopen = function () { $("conn").textContent = "live"; };
    ws.onclose = function () { $("conn").textContent = "reconnecting…"; setTimeout(connect, 1500); };
    ws.onmessage = function (e) {
      var ev = JSON.parse(e.data), t = new Date(ev.ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      if (ev.type === "answer" && ev.question) {
        add("<b>" + esc(ev.question) + "</b><br><span class='muted'>" + t + " · " + esc(ev.speech) +
            (ev.repeat > 1 ? " · asked " + ev.repeat + "× in 10 min" : "") + "</span>");
      } else if (ev.type === "alert") {
        $("alerts").className = "alert";
        $("alerts").innerHTML = "<h2>Alert · " + t + "</h2><p>" + esc(ev.text) + "</p><span class='muted'>iMessage: " + esc(ev.status) + "</span>";
      } else if (ev.type === "seen" || ev.type === "worn" || ev.type === "glasses") refresh();
    };
  }
  $("pf").onsubmit = function (e) {
    e.preventDefault();
    // Open this page as /caregiver?token=<apiToken> on a phone; write calls from the network need it.
    var token = (location.search.match(/[?&]token=([^&]+)/) || [])[1] || "";
    fetch("/api/patient", { method: "POST", headers: { "content-type": "application/json", "x-lucia-token": decodeURIComponent(token) },
                            body: JSON.stringify({ name: $("pname").value }) });
  };
  connect(); refresh(); setInterval(refresh, 5000);
})();
</script>
</body>
</html>
